name: Deploy PL official branded site to GitHub Pages
on:
  push:
    branches: [main]
  schedule:
    # Off-hour times reduce GitHub's scheduled-workflow congestion.
    - cron: '13,43 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pl-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout approved public frontend
        uses: actions/checkout@v4
      - name: Build approved public storefront
        env:
          PL_REFRESH_CATALOG: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
        run: node tools/prepare-preview.mjs
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload Pages content
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
